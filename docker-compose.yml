services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dotnet_mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourPassword123.}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourPassword123.}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dotnet_network

  redis:
    image: redis:7-alpine
    container_name: dotnet_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dotnet_network

  webapi:
    container_name: dotnet_webapi
    restart: unless-stopped
    build:
      context: .
      dockerfile: src/DotnetArchitecture.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=DotnetArchitectureDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourPassword123.};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__SecretKey: "SuperSecretKeyForDotnetArchitectureDemo2026!WithEnoughBits"
      Jwt__Issuer: "DotnetArchitectureApi"
      Jwt__Audience: "DotnetArchitectureClient"
    ports:
      - "${WEBAPI_PORT:-5294}:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dotnet_network

volumes:
  mssql_data:
    driver: local
  redis_data:
    driver: local

networks:
  dotnet_network:
    driver: bridge
